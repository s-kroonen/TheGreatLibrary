name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Boot the real stack (app + Postgres) from docker-compose.yml
        run: |
          cat > .env <<EOF
          POSTGRES_USER=librarian
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=greatlibrary
          APP_PORT=3000
          BETTER_AUTH_SECRET=ci-test-secret-not-used-in-production-0123456789
          BETTER_AUTH_URL=http://localhost:3000
          EOF
          docker compose build
          docker compose up -d

      - name: Wait for the app to come up healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then
              echo "App responded 200 after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "App never became healthy" >&2
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Portainer stack redeploy
        run: |
          if [ -z "${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_STACK_WEBHOOK_URL secret is not set — skipping deploy trigger." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}"
